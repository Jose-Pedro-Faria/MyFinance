{% extends "base.html" %}
{% block conteudo %}
<h1>Editar relatório de {{ relatorio.mes|date:"F Y"|capfirst }}</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  {% include "relatorios/_campos.html" %}
  <p>
    <button type="submit">Guardar alterações</button>
    <a href="{% url 'relatorios:lista' %}">Cancelar</a>
  </p>
</form>
{% endblock %}
