{% extends "base.html" %}
{% block conteudo %}
<h1>Novo relatório mensal</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  {% include "seletor_mes.html" %}
  {% include "relatorios/_campos.html" %}
  <p>
    <button type="submit" id="btn_guardar">Guardar</button>
    <a href="{% url 'relatorios:lista' %}">Cancelar</a>
  </p>
</form>
<p><a href="{% url 'relatorios:nova_subcategoria' %}">+ Criar nova subcategoria</a></p>
{% endblock %}
