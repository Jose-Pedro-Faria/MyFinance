{% extends "base.html" %}
{% block conteudo %}
<h1>Editar registo de {{ registo.mes|date:"F Y"|capfirst }}</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  {% include "patrimonio/_campos.html" %}
  <p>
    <button type="submit">Guardar alterações</button>
    <a href="{% url 'patrimonio:lista' %}">Cancelar</a>
  </p>
</form>
{% endblock %}
