{% extends "base.html" %}
{% block conteudo %}
<h1>Novo registo mensal de património</h1>
{% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  {% include "seletor_mes.html" %}
  {% include "patrimonio/_campos.html" %}
  <p>
    <button type="submit" id="btn_guardar">Guardar</button>
    <a href="{% url 'patrimonio:lista' %}">Cancelar</a>
  </p>
</form>
<p><a href="{% url 'patrimonio:nova_categoria' %}">+ Criar nova categoria</a></p>
{% endblock %}
