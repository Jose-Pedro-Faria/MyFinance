services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY no ficheiro .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      HTTPS: ${HTTPS:-0}
      DB_PATH: /data/db.sqlite3
    volumes:
      - dados:/data
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  dados: